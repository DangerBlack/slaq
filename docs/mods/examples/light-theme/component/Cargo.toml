[package]
name = "slaq-mod-light-theme"
version = "0.1.1"
edition = "2024"
publish = false

# Its own workspace: slaq's crate must not pick this one up.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen-rt = { version = "0.44.0", features = ["bitflags"] }

[package.metadata.component]
package = "slaq:light-theme"

# Built against slaq's own contract, so the example cannot drift from it.
[package.metadata.component.target]
path = "../../../../../wit"
world = "plugin"

[package.metadata.component.dependencies]

[profile.release]
opt-level = "s"
lto = true
strip = true
