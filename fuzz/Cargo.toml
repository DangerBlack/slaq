[package]
name = "slaq-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
# mrkdwn.rs uses chrono for the `<!date^…>` expansion.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# the `signaling` target decodes the Chime protobuf directly.
prost = "0.13"

[build-dependencies]
prost-build = "0.13"
protox = "0.7"

# The targets are deliberately self-contained: they compile the parser source
# (or regenerate the proto) directly instead of depending on the `slaq` crate,
# so the sanitizer build does not drag in the GUI, libvpx, WebRTC, or
# `screenshots` (which no longer builds on current nightly).
[[bin]]
name = "mrkdwn"
path = "fuzz_targets/mrkdwn.rs"
test = false
doc = false
bench = false

[[bin]]
name = "signaling"
path = "fuzz_targets/signaling.rs"
test = false
doc = false
bench = false
