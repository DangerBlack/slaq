# cargo-audit configuration (RUSTSEC).
#
# Kept in sync with `deny.toml`, which carries the same ignores with their
# reasons. Only add an entry with a written justification.

[advisories]
ignore = [
    # `quick-xml` 0.30 via `zbus_xml` (the `accesskit` accessibility stack).
    # No upgrade path in that graph; the input is the local AT-SPI D-Bus
    # introspection XML, never message content.
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
    # `crypto-bigint` 0.5 — timing variability, reached through the huddle's
    # DTLS key exchange (`webrtc` -> `webrtc-dtls` -> `p256`/`p384`). Accepted
    # with a plan, not dismissed: the fix is a major that `elliptic-curve` and
    # `webrtc-dtls` have to take first, and our `webrtc` is nine breaking minors
    # behind. `deny.toml` carries the full reasoning; the roadmap carries the
    # upgrade as open work.
    "RUSTSEC-2026-0387",
]
