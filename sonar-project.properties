# SonarQube / SonarCloud project configuration.
#
# Self-hosted SonarQube (the docker-compose in docs/security.md):
#   docker run ... sonarsource/sonar-scanner-cli
# SonarCloud additionally needs `sonar.organization` and a SONAR_TOKEN.

sonar.projectKey=slaq
sonar.projectName=slaq
sonar.projectVersion=0.2.0
sonar.sourceEncoding=UTF-8

# Rust plus the two support languages (build script, protocol tooling).
sonar.sources=src,build.rs,proto

# Generated code and binary assets are not analyzable and only add noise.
sonar.exclusions=target/**,**/*.png,**/*.ttf,**/*.tsv

# SonarQube imports clippy's lints for Rust when a report is supplied; the CI
# job generates it first (see .github/workflows/security.yml).
sonar.rust.clippy.enabled=true
sonar.rust.clippy.reportPaths=target/clippy.json
